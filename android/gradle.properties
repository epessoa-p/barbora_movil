org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# El proyecto está en D: y la caché de Flutter (pub) en C:. La compilación
# incremental de Kotlin no puede relacionar rutas de discos distintos y llena
# la consola de errores en rojo («different roots»), aunque el APK sale bien.
# Sin incremental, compila limpio (un poco más lento solo la primera vez).
kotlin.incremental=false
