<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" style="background: #0B0C10; font-family: 'Inter', 'Montserrat', 'Segoe UI', sans-serif;">
  <defs>
    <!-- Accent Copper Red Gradient -->
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E64A38"/>
      <stop offset="100%" stop-color="#B82E1E"/>
    </linearGradient>
    
    <!-- Dark Titanium Metallic Gradient for Secondary Geo Element -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A5B1"/>
    </linearGradient>
  </defs>

  <!-- LOGO MARK / SYMBOL -->
  <g transform="translate(70, 45)">
    <!-- Vertical Precision Stem (Data Pillar / Clipper Spine) -->
    <path d="M 20 10 L 48 10 L 48 140 L 20 140 Z" fill="url(#titanium)" />
    
    <!-- Top Geometric Arch (Precision Edge Chamfer) -->
    <path d="M 58 10 L 102 10 C 124 10 138 22 138 42 C 138 60 125 70 105 72 L 58 72 Z" fill="url(#brandRed)" />
    
    <!-- Bottom Geometric Arch + Data Node Flow Cut -->
    <path d="M 58 82 L 108 82 C 130 82 146 95 146 115 C 146 132 130 140 106 140 L 58 140 Z" fill="url(#brandRed)" />
    
    <!-- Precision Negative Space Cuts (45° Precision Haircut Line / Laser Cut) -->
    <polygon points="48,70 150,70 150,84 48,84" fill="#0B0C10" />
    <polygon points="12,110 55,67 63,75 20,118" fill="#0B0C10" />
    
    <!-- Floating SaaS Sync Node (Connecting App + Shop) -->
    <circle cx="128" cy="22" r="5" fill="#0B0C10" />
    <circle cx="128" cy="22" r="3" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <!-- BARBORA Primary Brand Name -->
  <text x="250" y="128" fill="#F8F9FA" font-size="64" font-weight="800" letter-spacing="12" font-family="'Montserrat', 'Inter', sans-serif">BARBORA</text>
  
  <!-- Modern SaaS Descriptor -->
  <text x="254" y="158" fill="#6C757D" font-size="12" font-weight="600" letter-spacing="6" font-family="'Inter', sans-serif">MANAGEMENT PLATFORM</text>

  <!-- Precision Structural Guideline Accent -->
  <line x1="254" y1="172" x2="310" y2="172" stroke="#E64A38" stroke-width="2" stroke-linecap="round"/>
</svg>
