name: barbora_movil
description: "App del personal de Barbora: agenda, atenciones y comisiones."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Textos del sistema (calendario, diálogos) en español.
  flutter_localizations:
    sdk: flutter

  # Cliente HTTP. Se usa http y no dio a propósito: las cabeceras y el manejo
  # de errores viven en un único sitio (core/api_client.dart), que es poco
  # código y deja claro qué pasa en cada respuesta.
  http: ^1.2.2

  # El token es una credencial de un sistema de negocio: va al llavero del
  # sistema operativo, no a SharedPreferences, que en un móvil con root se lee
  # en texto plano.
  flutter_secure_storage: ^9.2.2

  provider: ^6.1.2

  # Fechas en español: «lunes 6 de octubre», no «Monday, October 6».
  intl: ^0.20.2

  # El logo de la marca es SVG; Flutter no lo pinta de serie.
  flutter_svg: ^2.0.10

  # Gráficos de los reportes (líneas y barras).
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generan el icono y el splash a partir de los PNG de tool/branding/, que a
  # su vez salen del logo SVG (ver tool/render_app_assets.dart). Solo en
  # desarrollo: no entran en la app.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# ── Icono de la app ───────────────────────────────────────────────────────────
# Regenerar tras cambiar el logo:
#   flutter test tool/render_app_assets.dart   # SVG → PNG
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/branding/app_icon.png
  # En Android 8+ el icono es adaptativo: el sistema recorta el primer plano
  # sobre el fondo. Por eso el monograma va aparte del color de fondo.
  adaptive_icon_background: "#0B0C10"
  adaptive_icon_foreground: tool/branding/app_icon_foreground.png
  remove_alpha_ios: true

# ── Pantalla de arranque ──────────────────────────────────────────────────────
# Regenerar tras cambiar el logo:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0C10"
  image: tool/branding/splash_logo.png
  android_12:
    color: "#0B0C10"
    image: tool/branding/splash_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    # Montserrat variable: es la tipografía del logotipo. Se empaqueta porque
    # ningún móvil la trae, y sin ella la palabra «Barbora» saldría con otra
    # letra distinta a la del panel web.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
